default: &default
  adapter: postgresql
  encoding: unicode
  pool: 25
  host: db
  username: postgres
  password: password

development:
  <<: *default
  database: speakerinnen_development

test:
  <<: *default
  database: speakerinnen_test

# Production connects via DATABASE_URL (set as a Kamal secret). This works both
# with a managed Postgres and with a Postgres accessory defined in deploy.yml.
production:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 25) %>
  url: <%= ENV["DATABASE_URL"] %>
